<!doctype html><html><body style="margin:0;padding:0;background:#f4f2ed;font-family:Georgia,'Times New Roman',serif;color:#1c1a16">
  <!-- INSTALL: Dashboard → Authentication → Email Templates → "Confirm signup" → paste this file. -->
  <!-- SUBJECT suggestion: Confirm your email — BDP CRM -->
  <!-- (Public sign-up is off; this only fires if you ever re-enable it.) -->
  <div style="max-width:600px;margin:0 auto;padding:32px 20px">
    <p style="font-family:Menlo,Consolas,monospace;font-size:11px;letter-spacing:3px;color:#8a867c;margin:0 0 8px">MATHENGE INC. · BDP CRM</p>
    <img src="https://crm.mathengeinc.com/logo.png" alt="Mathenge Inc" width="120" style="display:block;margin:0 0 20px"/>
    <div style="background:#fffdf9;border:1px solid #e7e2d6;border-radius:14px;padding:32px">
      <h1 style="font-size:30px;font-weight:400;line-height:1.15;margin:0 0 16px">Confirm your email</h1>
      <p style="font-size:15px;line-height:1.75;margin:0 0 12px">Tap below to confirm {{ .Email }} and finish setting up your account.</p>
      <p style="font-size:15px;line-height:1.75;margin:0">If you didn't ask for this, ignore this email.</p>
      <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=signup&next=/" style="display:inline-block;margin-top:24px;background:#1c1a16;color:#faf9f7;text-decoration:none;font-family:Arial,sans-serif;font-size:14px;padding:12px 28px;border-radius:999px">Confirm email</a>
    </div>
    <p style="font-family:Arial,sans-serif;font-size:12px;color:#8a867c;margin:20px 0 0">Nairobi, Kenya · Dubai, UAE · info@mathengeinc.com</p>
  </div>
</body></html>
